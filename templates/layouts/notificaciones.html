<style>

       /* ========================================

.notification-container {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 10000;
    display: flex;
    flex-direction: column;
    gap: 12px;
    pointer-events: none;
}

.notification {
    pointer-events: auto;
    background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
    backdrop-filter: blur(20px);
    padding: 16px 20px;
    border-radius: 16px;
    color: #ffffff;
    font-weight: 500;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(212, 175, 55, 0.3);
    animation: slideInRight 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    min-width: 320px;
    max-width: 400px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    transition: all 0.3s ease;
    border-left: 5px solid #10b981;
}

.notification:hover {
    transform: translateX(-5px);
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(212, 175, 55, 0.5);
}

/* Tipos de notificaciones */
.notification.info {
    border-left: 5px solid #10b981;
    background: linear-gradient(135deg, #1a2a1a 0%, #0d1a0d 100%);
}

.notification.success {
    border-left: 5px solid #10b981;
    background: linear-gradient(135deg, #1a2a1a 0%, #0d1a0d 100%);
}

.notification.delete {
    border-left: 5px solid #ef4444;
    background: linear-gradient(135deg, #2a1a1a 0%, #1a0d0d 100%);
}

.notification.error {
    border-left: 5px solid #ef4444;
    background: linear-gradient(135deg, #2a1a1a 0%, #1a0d0d 100%);
}

.notification.warning {
    border-left: 5px solid #f59e0b;
    background: linear-gradient(135deg, #2a2a1a 0%, #1a1a0d 100%);
}

/* Contenido */
.notification-content {
    display: flex;
    align-items: center;
    gap: 14px;
    flex: 1;
}

.notification-icon {
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    font-size: 18px;
    font-weight: bold;
    flex-shrink: 0;
}

.notification.success .notification-icon,
.notification.info .notification-icon {
    background: #10b981;
    color: #000;
    box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
}

.notification.delete .notification-icon,
.notification.error .notification-icon {
    background: #ef4444;
    color: #fff;
    box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
}

.notification.warning .notification-icon {
    background: #f59e0b;
    color: #000;
    box-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
}

.notification-message {
    flex: 1;
    font-size: 14px;
    line-height: 1.5;
}

.notification-message strong {
    display: block;
    font-size: 15px;
    margin-bottom: 4px;
    font-weight: 700;
}

.notification-message span {
    color: rgba(255, 255, 255, 0.9);
}

.notification-time {
    font-size: 10px;
    color: #bba163;
    margin-top: 6px;
    display: block;
    font-family: monospace;
}

.close-notification {
    background: rgba(255, 255, 255, 0.08);
    border: none;
    color: #bba163;
    cursor: pointer;
    font-size: 18px;
    padding: 6px 10px;
    border-radius: 10px;
    transition: all 0.2s ease;
    flex-shrink: 0;
    line-height: 1;
}

.close-notification:hover {
    background: rgba(255, 255, 255, 0.2);
    color: #f5d487;
    transform: scale(1.05);
}

/* Animaciones */
@keyframes slideInRight {
    from {
        transform: translateX(100%);
        opacity: 0;
    }
    to {
        transform: translateX(0);
        opacity: 1;
    }
}

@keyframes slideOutRight {
    from {
        transform: translateX(0);
        opacity: 1;
    }
    to {
        transform: translateX(100%);
        opacity: 0;
    }
}

.notification.fade-out {
    animation: slideOutRight 0.3s ease-out forwards;
}

@media (max-width: 768px) {
    .notification-container {
        top: 10px;
        right: 10px;
        left: 10px;
    }
    
    .notification {
        min-width: auto;
        max-width: 100%;
        width: calc(100% - 20px);
        padding: 14px 16px;
    }
    
    .notification-icon {
        width: 32px;
        height: 32px;
        font-size: 16px;
    }

<div id="notificationContainer" class="notification-container"></div>

<script>
    // ========================================
    // SISTEMA DE NOTIFICACIONES GLOBAL
    // ========================================

    var NOTIFICATION_DURATION = 4000;
    var NOTIFICATION_MAX_STACK = 5;

    function getCurrentTime() {
        var now = new Date();

        return now.toLocaleTimeString('es-ES', {
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit'
        });
    }

    function closeNotification(notification, immediate) {
        if (!notification) return;

        if (immediate) {
            if (notification.parentNode) {
                notification.parentNode.removeChild(notification);
            }
            return;
        }

        notification.classList.add('fade-out');

        setTimeout(function () {
            if (notification.parentNode) {
                notification.parentNode.removeChild(notification);
            }
        }, 300);
    }

    function showNotification(message, type, title, duration) {

        type = type || 'info';
        duration = duration || NOTIFICATION_DURATION;

        var container = document.getElementById('notificationContainer');

        if (!container) {
            var newContainer = document.createElement('div');
            newContainer.id = 'notificationContainer';
            newContainer.className = 'notification-container';

            document.body.appendChild(newContainer);

            container = newContainer;
        }

        var existingNotes = container.querySelectorAll('.notification');

        if (existingNotes.length >= NOTIFICATION_MAX_STACK) {
            var oldestNote = existingNotes[0];

            if (oldestNote) {
                closeNotification(oldestNote, true);
            }
        }

        var notification = document.createElement('div');
        notification.className = 'notification ' + type;

        var icon = '';
        var displayTitle = title || '';

        switch (type) {

            case 'success':
                icon = '✓';
                displayTitle = displayTitle || 'Editado';
                break;

            case 'info':
                icon = '✓';
                displayTitle = displayTitle || 'Creado';
                break;

            case 'delete':
                icon = '🗑';
                displayTitle = displayTitle || 'Eliminado';
                break;

            case 'error':
                icon = '✗';
                displayTitle = displayTitle || 'Error';
                break;

            case 'warning':
                icon = '⚠';
                displayTitle = displayTitle || 'Advertencia';
                break;

            default:
                icon = '✓';
                displayTitle = displayTitle || 'Información';
        }

        var currentTime = getCurrentTime();

        notification.innerHTML =
            '<div class="notification-content">' +
                '<div class="notification-icon">' + icon + '</div>' +
                '<div class="notification-message">' +
                    '<strong>' + displayTitle + '</strong>' +
                    '<span>' + message + '</span>' +
                    '<span class="notification-time">' + currentTime + '</span>' +
                '</div>' +
            '</div>' +
            '<button class="close-notification">✕</button>';

        container.appendChild(notification);

        var timeout = setTimeout(function () {
            closeNotification(notification);
        }, duration);

        var closeBtn = notification.querySelector('.close-notification');

        if (closeBtn) {
            closeBtn.addEventListener('click', function () {
                clearTimeout(timeout);
                closeNotification(notification);
            });
        }

        return notification;
    }

    function showDjangoMessages() {

        var messagesContainer = document.getElementById('django-messages-data');

        if (messagesContainer) {

            var messages = messagesContainer.querySelectorAll('.django-msg');

            for (var i = 0; i < messages.length; i++) {

                var msg = messages[i];

                var messageText = msg.getAttribute('data-message');
                var messageTag = msg.getAttribute('data-tag');

                var type = 'info';
                var title = '';

                if (messageTag === 'success') {
                    type = 'success';
                    title = 'Éxito';
                }

                else if (messageTag === 'delete') {
                    type = 'delete';
                    title = 'Eliminado';
                }

                else if (messageTag === 'error') {
                    type = 'error';
                    title = 'Error';
                }

                else if (messageTag === 'warning') {
                    type = 'warning';
                    title = 'Advertencia';
                }

                else if (messageTag === 'info') {
                    type = 'info';
                    title = 'Creado';
                }

                showNotification(messageText, type, title);
            }
        }
    }

    function showWelcomeNotification(rol) {

        var mensajes = {
            'cocinero': 'Bienvenido al panel de cocina',
            'mesero': 'Bienvenido al panel de mesero',
            'cliente': 'Bienvenido a La Fragata Giratoria',
            'admin': 'Bienvenido al panel de administración'
        };

        var titulos = {
            'cocinero': 'Cocina',
            'mesero': 'Mesero',
            'cliente': 'La Fragata Giratoria',
            'admin': 'Administrador'
        };

        var rolSeleccionado = rol || 'cliente';

        setTimeout(function () {

            showNotification(
                mensajes[rolSeleccionado] || 'Bienvenido al sistema',
                'info',
                titulos[rolSeleccionado] || 'Bienvenido'
            );

        }, 500);
    }

    document.addEventListener('DOMContentLoaded', function () {

        setTimeout(function () {
            showDjangoMessages();
        }, 100);

    });
</script>
