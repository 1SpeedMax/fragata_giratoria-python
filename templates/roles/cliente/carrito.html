<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito - La Fragata Giratoria</title>
    <link rel="icon" type="image/jpeg" href="/static/img/icono-fragata.jpg">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            color: #fff;
            background: #000;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 2rem;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            border-bottom: 2px solid rgba(212, 175, 55, 0.4);
            margin-bottom: 2rem;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo-contenedor {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .logo-img {
            height: 50px;
            width: auto;
        }

        .nombre-logo {
            color: #f5d487;
            font-size: 2.1rem;
            font-weight: bold;
            letter-spacing: 1px;
            font-family: 'Georgia', serif;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            transition: 0.3s;
            font-size: 1.2rem;
            font-weight: 500;
        }

        nav a:hover {
            color: #f5d487;
        }

        .icono-carrito {
            display: flex;
            align-items: center;
            position: relative;
        }

        .icono-carrito img {
            width: 28px;
            height: 28px;
            filter: brightness(0) invert(1);
            transition: 0.3s;
        }

        .icono-carrito:hover img {
            filter: brightness(1) invert(0) sepia(1) saturate(5) hue-rotate(10deg);
        }

        .cart-count {
            position: absolute;
            top: -8px;
            right: -12px;
            background: #d4af37;
            color: black;
            font-size: 10px;
            font-weight: bold;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .usuario-box {
            position: relative;
            cursor: pointer;
            background: rgba(255, 215, 130, 0.1);
            padding: 6px 15px;
            border-radius: 30px;
            border: 1px solid rgba(255, 215, 130, 0.3);
            font-size: 1.5rem;
            font-weight: 600;
        }

        .dropdown {
            display: none;
            position: absolute;
            top: 110%;
            right: 0;
            background: #1a1a1a;
            border: 1px solid #f5d487;
            border-radius: 12px;
            padding: 12px;
            min-width: 200px;
            z-index: 1002;
        }

        .dropdown p {
            margin: 5px 0;
            font-size: 0.9rem;
        }

        .dropdown a {
            display: block;
            color: #f5d487;
            text-decoration: none;
            margin: 8px 0;
            font-weight: 600;
            font-size: 1.2rem;
        }

        .dropdown button {
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
        }

        .carrito-container {
            max-width: 1200px;
            margin: 2rem auto;
            background: rgba(0, 0, 0, 0.8);
            padding: 2rem;
            border-radius: 20px;
        }

        .carrito-container h1 {
            text-align: center;
            font-size: 2.2rem;
            margin-bottom: 2rem;
            font-family: 'Times New Roman', Times, serif;
            color: #f5d487;
        }

        .carrito-items {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .carrito-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 1rem;
            border: 1px solid rgba(200, 159, 76, 0.3);
            position: relative;
        }

        .carrito-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #c89f4c, #f5d487);
            border-radius: 16px 16px 0 0;
        }

        .item-info {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .item-image {
            flex-shrink: 0;
        }

        .item-image img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 12px;
            border: 2px solid #c89f4c;
            background: #1a1a1a;
        }

        .item-details {
            flex: 2;
            min-width: 160px;
        }

        .item-details h3 {
            color: #f5d487;
            margin-bottom: 0.3rem;
            font-size: 1.1rem;
        }

        .item-desc {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.8rem;
        }

        .item-pricing {
            text-align: right;
            min-width: 150px;
        }

        .item-precio {
            font-size: 1rem;
            font-weight: bold;
            color: #c89f4c;
        }

        .item-cantidad-control {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            margin: 8px 0;
        }

        .btn-cantidad-mas,
        .btn-cantidad-menos {
            background: #c89f4c;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            color: black;
            transition: all 0.2s ease;
        }

        .btn-cantidad-mas:hover,
        .btn-cantidad-menos:hover {
            background: #d4af37;
            transform: scale(1.05);
        }

        .cantidad-valor {
            min-width: 28px;
            text-align: center;
            font-weight: bold;
        }

        .item-subtotal {
            font-size: 0.9rem;
            font-weight: bold;
            color: #f5d487;
            background: rgba(200, 159, 76, 0.15);
            padding: 0.2rem 0.5rem;
            border-radius: 8px;
            display: inline-block;
        }

        .carrito-total {
            text-align: right;
            padding: 1rem;
            background: rgba(200, 159, 76, 0.1);
            border-radius: 12px;
            margin: 1.5rem 0;
        }

        .carrito-total h3 {
            font-size: 1.4rem;
            color: #f5d487;
        }

        .botones-acciones {
            display: flex;
            gap: 0.8rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 1.5rem;
        }

        .btn {
            padding: 8px 20px;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s ease;
        }

        .btn-seguir {
            background: transparent;
            border: 2px solid #c89f4c;
            color: #c89f4c;
        }

        .btn-seguir:hover {
            background: #c89f4c;
            color: black;
            transform: translateY(-2px);
        }

        .btn-pago {
            background: linear-gradient(135deg, #c89f4c, #d4af37);
            color: black;
        }

        .btn-pago:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(200, 159, 76, 0.4);
        }

        .btn-historial {
            background: transparent;
            border: 2px solid #28a745;
            color: #28a745;
        }

        .btn-historial:hover {
            background: #28a745;
            color: black;
        }

        .btn-limpiar {
            background: #dc3545;
            color: white;
        }

        .btn-limpiar:hover {
            background: #c82333;
        }

        .carrito-vacio {
            text-align: center;
            padding: 2rem;
        }

        .carrito-vacio p {
            font-size: 1.2rem;
            color: #f5d487;
        }

        /* =======================
       TABLET ======================= */
        @media (max-width: 768px) {

            header {
                display: flex;
                flex-direction: column;
                align-items: center;
                text-align: center;
                gap: 15px;
                padding: 1rem;
            }

            .logo-contenedor {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 10px;
            }

            .logo-img {
                width: 55px;
                height: 55px;
            }

            .nombre-logo {
                font-size: 1.5rem;
                line-height: 1.1;
            }

            nav {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                align-items: center;
                gap: 10px;
                width: 100%;
            }

            nav a {
                font-size: 1rem;
                padding: 8px 12px;
            }

            .usuario-box {
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 8px 12px;
            }

            .usuario-box span {
                font-size: 0.9rem;
                white-space: nowrap;
            }

            .icono-carrito img {
                width: 24px;
                height: 24px;
            }
        }

        /* =======================
        MÓVIL ======================= */
        @media (max-width: 480px) {

            header {
                gap: 12px;
                padding: 15px 10px;
            }

            .logo-img {
                width: 50px;
                height: 50px;
            }

            .nombre-logo {
                font-size: 1.3rem;
            }

            nav {
                gap: 5px;
            }

            nav a {
                font-size: 0.85rem;
                padding: 6px 8px;
            }

            .usuario-box {
                padding: 6px 10px;
            }

            .usuario-box span {
                font-size: 0.75rem;
                white-space: nowrap;
            }

            .icono-carrito img {
                width: 20px;
                height: 20px;
            }

            .cart-count {
                width: 16px;
                height: 16px;
                font-size: 9px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo-contenedor">
            <img src="/static/img/icono-fragata.jpg" alt="logo" class="logo-img">
            <span class="nombre-logo">La Fragata Giratoria</span>
        </div>
        <nav>
            <a href="/inicio/">Inicio</a>
            <a href="/cliente/menu/">Menú</a>
            <a href="/cliente/carrito/" class="icono-carrito">
                <img src="/static/img/carrito.png" alt="Carrito">
                <span class="cart-count" id="cartCount">0</span>
            </a>
            <div class="usuario-box" onclick="toggleDropdown()"
                onkeydown="if(event.key==='Enter'||event.key===' ') toggleDropdown()" tabindex="0" role="button">
                <span>Arleidis Coronado</span>
                <div class="dropdown" id="dropdownMenu">
                    <p><strong>Arleidis Coronado</strong></p>
                    <p>arlcornd@gmail.com</p>
                    <a href="/cliente/historial/">Historial de pedidos</a>
                    <form action="/logout/" method="post">
                        <input type="hidden" name="csrfmiddlewaretoken"
                            value="3LzcwUxQWNu7wuV89n6zBQZ3PKdrpdb1hqAOcBxXJ51Vgpd2TKYyG2wMMCYBarf4">
                        <button type="submit">Cerrar sesión</button>
                    </form>
                </div>
            </div>
        </nav>
    </header>

    <div class="carrito-container">
        <h1>Carrito de Compras</h1>


        <div class="carrito-vacio">
            <p>No hay productos en el carrito</p>
            <div class="botones-acciones">
                <a href="/cliente/menu/" class="btn btn-seguir">Ver Menú</a>
                <a href="/cliente/historial/" class="btn btn-historial">Ver Historial</a>
            </div>
        </div>

    </div>

    <script>
        function actualizarTotalCarrito() {
            var total = 0;
            var totalItems = 0;
            var items = document.querySelectorAll('.carrito-item');
            items.forEach(function (item) {
                var precio = parseFloat(item.dataset.precio);
                var cantidad = parseInt(item.querySelector('.cantidad-valor').innerText);
                var subtotal = precio * cantidad;
                total += subtotal;
                totalItems += cantidad;
                item.querySelector('.item-subtotal').innerHTML = 'Subtotal: $ ' + subtotal.toFixed(0);
                var key = item.dataset.itemKey;
                var cantidadInput = document.querySelector('.cantidad-input-' + key);
                if (cantidadInput) {
                    cantidadInput.value = cantidad;
                }
            });
            document.getElementById('total-carrito').innerText = total.toFixed(0);
            document.getElementById('cartCount').innerText = totalItems;
        }

        function actualizarCantidad(key, nuevaCantidad) {
            fetch("/carrito/actualizar-cantidad/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": document.querySelector('[name=csrfmiddlewaretoken]').value
                },
                body: JSON.stringify({ item_key: key, cantidad: nuevaCantidad })
            }).catch(function (error) {
                console.error("Error:", error);
            });
        }

        function eliminarItem(key) {
            Swal.fire({
                title: "Eliminar platillo",
                text: "Deseas eliminar este platillo del carrito?",
                icon: "question",
                showCancelButton: true,
                confirmButtonText: "Si, eliminar",
                cancelButtonText: "Cancelar",
                confirmButtonColor: "#c89f4c",
                background: "rgba(20, 20, 25, 0.95)"
            }).then(function (result) {
                if (result.isConfirmed) {
                    fetch("/carrito/eliminar-item/", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "X-CSRFToken": document.querySelector('[name=csrfmiddlewaretoken]').value
                        },
                        body: JSON.stringify({ item_key: key })
                    }).then(function () {
                        location.reload();
                    });
                }
            });
        }

        document.querySelectorAll('.btn-cantidad-mas').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var key = this.dataset.key;
                var cantidadSpan = this.parentElement.querySelector('.cantidad-valor');
                var cantidad = parseInt(cantidadSpan.innerText);
                cantidad++;
                cantidadSpan.innerText = cantidad;
                actualizarTotalCarrito();
                actualizarCantidad(key, cantidad);
            });
        });

        document.querySelectorAll('.btn-cantidad-menos').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var key = this.dataset.key;
                var cantidadSpan = this.parentElement.querySelector('.cantidad-valor');
                var cantidad = parseInt(cantidadSpan.innerText);
                if (cantidad > 1) {
                    cantidad--;
                    cantidadSpan.innerText = cantidad;
                    actualizarTotalCarrito();
                    actualizarCantidad(key, cantidad);
                } else {
                    eliminarItem(key);
                }
            });
        });

        document.getElementById('btnLimpiarCarrito')?.addEventListener('click', function () {
            Swal.fire({
                title: "Limpiar carrito",
                text: "Todos los platillos seran eliminados",
                icon: "warning",
                showCancelButton: true,
                confirmButtonText: "Si, limpiar",
                cancelButtonText: "Cancelar",
                confirmButtonColor: "#c89f4c",
                background: "rgba(20, 20, 25, 0.95)"
            }).then(function (result) {
                if (result.isConfirmed) {
                    fetch("/carrito/limpiar/", {
                        method: "POST",
                        headers: { "X-CSRFToken": document.querySelector('[name=csrfmiddlewaretoken]').value }
                    }).then(function () {
                        location.reload();
                    });
                }
            });
        });

        function toggleDropdown() {
            var menu = document.getElementById("dropdownMenu");
            if (menu) {
                menu.style.display = menu.style.display === "block" ? "none" : "block";
            }
        }

        document.addEventListener("click", function (e) {
            var box = document.querySelector(".usuario-box");
            var menu = document.getElementById("dropdownMenu");
            if (box && menu && !box.contains(e.target)) {
                menu.style.display = "none";
            }
        });

        var formPedido = document.getElementById("formPedido");
        if (formPedido) {
            formPedido.addEventListener("submit", function (e) {
                e.preventDefault();
                if (document.querySelectorAll('.carrito-item').length === 0) {
                    Swal.fire({ title: "Carrito vacio", text: "No hay productos para enviar", icon: "warning" })
                        .then(function () {
                            window.location.href = "/cliente/menu/";
                        });
                    return;
                }
                Swal.fire({
                    title: "Enviar pedido",
                    text: "Una vez enviado no podras modificarlo.",
                    icon: "question",
                    showCancelButton: true,
                    confirmButtonText: "Si, enviar",
                    cancelButtonText: "Cancelar",
                    confirmButtonColor: "#c89f4c",
                    background: "rgba(20, 20, 25, 0.95)"
                }).then(function (result) {
                    if (result.isConfirmed) {
                        Swal.fire({ title: "Enviando pedido...", allowOutsideClick: false, didOpen: function () { Swal.showLoading(); } });
                        fetch("/cliente/pedido/registrar/", {
                            method: "POST",
                            body: new FormData(formPedido),
                            headers: { "X-Requested-With": "XMLHttpRequest" }
                        })
                            .then(function (res) { return res.json(); })
                            .then(function (data) {
                                if (data.success) {
                                    Swal.fire({
                                        title: "Pedido Enviado",
                                        html: '<strong>Pedido #' + data.pedido_id + '</strong> ha sido enviado a la cocina.',
                                        icon: "success",
                                        showDenyButton: true,
                                        confirmButtonText: "Ver Menu",
                                        denyButtonText: "Ver Historial",
                                        confirmButtonColor: "#c89f4c"
                                    }).then(function (res) {
                                        if (res.isConfirmed) {
                                            window.location.href = "/cliente/menu/";
                                        } else if (res.isDenied) {
                                            window.location.href = "/cliente/historial/";
                                        }
                                    });
                                } else {
                                    Swal.fire({ title: "Error", text: data.error || "Error al enviar", icon: "error" });
                                }
                            }).catch(function () {
                                Swal.fire({ title: "Error", text: "Error de conexion", icon: "error" });
                            });
                    }
                });
            });
        }

        actualizarTotalCarrito();
    </script>
</body>

</html>
