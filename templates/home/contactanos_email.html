<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuevo mensaje de contacto</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f5f5f5; padding: 20px;">
  <div style="max-width: 650px; margin: 0 auto; background-color: #ffffff; border-radius: 8px; box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08); overflow: hidden;">
    <div style="background-color: #0f172a; color: #ffffff; padding: 24px 30px; text-align: center;">
      <h1 style="margin: 0; font-size: 24px;">Nuevo mensaje desde el formulario de contacto</h1>
    </div>
    <div style="padding: 28px 30px; color: #0f172a;">
      <p style="font-size: 16px; margin-bottom: 12px;"><strong>Nombre:</strong> {{ nombre }}</p>
      <p style="font-size: 16px; margin-bottom: 12px;"><strong>Email:</strong> {{ email }}</p>
      <p style="font-size: 16px; margin-bottom: 12px;"><strong>Asunto:</strong> {{ asunto }}</p>
      <div style="margin-top: 20px; padding: 18px; background-color: #f3f4f6; border-radius: 8px;">
        <p style="margin: 0; font-size: 16px; line-height: 1.6;"><strong>Mensaje:</strong></p>
        <p style="white-space: pre-wrap; color: #334155;">{{ mensaje }}</p>
      </div>
    </div>
    <div style="background-color: #e2e8f0; color: #334155; padding: 16px 30px; font-size: 14px;">
      <p style="margin: 0;">Este mensaje se generó desde el formulario de contacto en el sitio web de La Fragata Giratoria.</p>
    </div>
  </div>
</body>
</html>
